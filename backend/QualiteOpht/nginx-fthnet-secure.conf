server {
    listen 443 ssl;
    server_name fthnet.hospital.local;

    # ── TLS 1.3 uniquement, pas de versions obsolètes ──
    ssl_certificate     /etc/nginx/ssl/fthnet.crt;
    ssl_certificate_key /etc/nginx/ssl/fthnet.key;
    ssl_trusted_certificate /etc/nginx/ssl/ca.crt;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Headers de sécurité ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

    # ── Rate limiting (10 req/min par IP) ──
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;
    limit_req zone=api_limit burst=5 nodelay;
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_conn addr 10;

    # ── Body size limit (images fond d'œil ~ 1-5 MB) ──
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # ── Logs (pas d'IP dans les logs si possible, ou pseudo-anonymisation) ──
    access_log /var/log/nginx/fthnet_access.log combined;
    error_log  /var/log/nginx/fthnet_error.log warn;

    # ── Health check (pas de rate limit) ──
    location /health {
        proxy_pass http://fthnet-api:8000/health;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        limit_req off;
    }

    # ── API principale : /predict ──
    location /predict {
        # Vérification du certificat client (mTLS optionnel)
        # ssl_verify_client on;
        # ssl_client_certificate /etc/nginx/ssl/ca.crt;

        proxy_pass http://fthnet-api:8000/predict;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Buffering désactivé pour les uploads
        proxy_buffering off;
        proxy_request_buffering on;
    }

    # ── Batch prediction ──
    location /predict_batch {
        proxy_pass http://fthnet-api:8000/predict_batch;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering on;
        client_max_body_size 50M;  # Batch = plusieurs images
    }

    # ── Blocker tout le reste ──
    location / {
        return 404;
    }
}

# ── Pas de serveur HTTP 80 (redirection vers 443 si absolument nécessaire) ──
server {
    listen 80;
    server_name fthnet.hospital.local;
    return 444;  # Connection closed without response
}
