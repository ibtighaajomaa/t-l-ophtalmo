version: "3.8"
# =============================================================================
# FTHNet Production - Docker Compose sécurisé
# Contexte : Données patients. Aucun port exposé directement vers Internet.
# =============================================================================

services:
  # ===========================================================================
  # 1. FTHNet API (Inference GPU) - ISOLÉ, pas d'accès externe direct
  # ===========================================================================
  fthnet-api:
    build:
      context: .
      dockerfile: Dockerfile.secure
    container_name: fthnet-api
    runtime: nvidia
    environment:
      - FTHNET_WEIGHTS=/app/pretrained_weight/net_g_226264S4.pth
      - FTHNET_EMBED_DIM=64
      - NVIDIA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    volumes:
      - type: bind
        source: ./pretrained_weight
        target: /app/pretrained_weight
        read_only: true
      # Tmpfs pour les uploads temporaires (disparaît au redémarrage)
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 200m
          mode: 1770
    networks:
      - ai_internal
    # Pas de ports exposés vers l'extérieur !
    # Seul nginx-gateway peut communiquer avec ce service
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_NICE  # Nécessaire pour certains scheduling GPU
    # Restart policy
    restart: unless-stopped
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '4.0'
          memory: 8G

  # ===========================================================================
  # 2. Nginx Gateway - SEUL POINT D'ENTRÉE (TLS 1.3, mTLS, rate limiting)
  # ===========================================================================
  nginx-gateway:
    image: nginx:1.25-alpine
    container_name: fthnet-gateway
    # Seul port exposé : 8443 en TLS 1.3 (pas de HTTP 80)
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl/fthnet.crt:/etc/nginx/ssl/fthnet.crt:ro
      - ./nginx/ssl/fthnet.key:/etc/nginx/ssl/fthnet.key:ro
      - ./nginx/ssl/ca.crt:/etc/nginx/ssl/ca.crt:ro
      - ./nginx/ratelimit.conf:/etc/nginx/conf.d/ratelimit.conf:ro
      # Cache pour les uploads temporaires
      - nginx_cache:/var/cache/nginx
    networks:
      - ai_internal
      - hospital_net
    depends_on:
      fthnet-api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # 3. Audit / Logs Database (PostgreSQL) - Qui a fait quoi, quand
  # ===========================================================================
  audit-db:
    image: postgres:15-alpine
    container_name: fthnet-audit-db
    environment:
      - POSTGRES_DB=fthnet_audit
      - POSTGRES_USER=audit_logger
      - POSTGRES_PASSWORD_FILE=/run/secrets/audit_db_password
    volumes:
      - audit_postgres:/var/lib/postgresql/data
      - ./init-scripts/audit.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    secrets:
      - audit_db_password
    networks:
      - ai_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # ===========================================================================
  # 4. SIEM / Log Collector (optionnel, pour centralisation)
  # ===========================================================================
  # fluentd:
  #   image: fluent/fluentd:v1.16-debian-1
  #   container_name: fthnet-fluentd
  #   volumes:
  #     - ./fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
  #     - fluentd_logs:/fluentd/log
  #   networks:
  #     - ai_internal
  #     - hospital_net
  #   restart: unless-stopped

  # ===========================================================================
  # 5. Prometheus (monitoring) - Interface interne uniquement
  # ===========================================================================
  # prometheus:
  #   image: prom/prometheus:v2.50
  #   container_name: fthnet-prometheus
  #   volumes:
  #     - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus_data:/prometheus
  #   networks:
  #     - ai_internal
  #   restart: unless-stopped

  # ===========================================================================
  # 6. Grafana (dashboards) - Interface interne uniquement
  # ===========================================================================
  # grafana:
  #   image: grafana/grafana:10.3
  #   container_name: fthnet-grafana
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
  #     - GF_SERVER_ROOT_URL=https://grafana.hospital.local
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   secrets:
  #     - grafana_admin_password
  #   networks:
  #     - ai_internal
  #     - hospital_net
  #   restart: unless-stopped

# =============================================================================
# Networks
# =============================================================================
networks:
  # Réseau interne AI : pas de route vers l'extérieur (internal: true)
  ai_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Réseau hospitalier (accès contrôlé via gateway uniquement)
  hospital_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24

# =============================================================================
# Volumes
# =============================================================================
volumes:
  audit_postgres:
    driver: local
  nginx_cache:
    driver: local
  # prometheus_data:
  #   driver: local
  # grafana_data:
  #   driver: local

# =============================================================================
# Secrets (fichiers sur le host, pas dans les images !)
# =============================================================================
secrets:
  audit_db_password:
    file: ./secrets/audit_db_password.txt
  # grafana_admin_password:
  #   file: ./secrets/grafana_admin_password.txt
